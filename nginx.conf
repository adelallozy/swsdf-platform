# nginx config for the SWSDF Platform production container.
# Container listens on 8080 to match the docker-compose host:container mapping.
# Serves the Vite build (base "/app/") with SPA history fallback.

server {
    listen      8080;
    listen      [::]:8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Emit relative redirects so Location headers stay correct behind the
    # host reverse proxy (no internal 8080 port leaked into the URL).
    absolute_redirect off;

    client_max_body_size 100M;

    # ── gzip ───────────────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # ── security headers ───────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff"                 always;
    add_header X-Frame-Options        "SAMEORIGIN"              always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── long-cache hashed Vite assets ──────────────────────────────────────
    location /app/new-front/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── the app is mounted at /app/ (Vite base); SPA history fallback ──────
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    # Redirect bare /app → /app/
    location = /app {
        return 301 /app/;
    }

    # Convenience: container root → app
    location = / {
        return 302 /app/;
    }

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
