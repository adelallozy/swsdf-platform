# ─────────────────────────────────────────────────────────────────────────────
# Standalone production deployment for SWSDF Platform.
#
# Build the Vite bundle outside Docker with `npm ci && npm run build`. The
# reusable nginx image contains only nginx and its configuration; dist/ is
# mounted read-only and can be deployed independently from the server image.
#
# Host port 8911 matches the existing host nginx /app/ block
# (Docs/nginx-current-app.conf -> proxy_pass http://localhost:8911), so no host
# nginx change is required. Change the port below only if 8911 is taken.
#
# Usage:
#   npm ci && npm run build            # produce dist/ outside Docker
#   docker compose build               # only when nginx/config changes
#   docker compose up -d               # serve the current dist/
#   docker compose down                # stop & remove
#   docker compose logs -f             # follow logs
# ─────────────────────────────────────────────────────────────────────────────

services:
  swsdf-platform:
    container_name: "${SWSDF_PLATFORM_CONTAINER:-swsdf-platform}"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        IMAGE_VERSION: "${SWSDF_PLATFORM_NGINX_TAG:-1.0.0}"
        VCS_REF: "${SWSDF_PLATFORM_NGINX_REVISION:-unknown}"
        BUILD_DATE: "${SWSDF_PLATFORM_NGINX_BUILD_DATE:-unknown}"
    image: ${SWSDF_PLATFORM_NGINX_IMAGE:-swsdf-platform-nginx}:${SWSDF_PLATFORM_NGINX_TAG:-1.0.0}
    ports:
      - "127.0.0.1:${SWSDF_PLATFORM_PORT:-8911}:8080"
    volumes:
      - "${SWSDF_PLATFORM_DIST_PATH:-./dist}:/usr/share/nginx/html/app:ro"
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/app/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
